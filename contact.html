<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Salone Bites.">
    <title>Contact Us | Salone Bites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main navigation header -->
    <header class="site-header">
        <nav class="navbar" aria-label="Main">
            <a href="index.html" class="logo">SALONE BITES</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <div class="contact-layout">

            <!-- Contact details section -->
            <section class="contact-info">
                <h1>Contact us</h1>
                <address>
                    <p>Freetown, Sierra Leone</p>
                    <p><a href="tel:+23273827889">+232 73 82 78 89</a></p>
                    <p><a href="mailto:info@salonebites.com">info@salonebites.com</a></p>
                </address>
            </section>

            <!-- Contact form section -->
            <section class="contact-form-container">
                <h2>Send us a message</h2>
                <form class="contact-form" action="#" method="post">
                    <label for="name" class="sr-only">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" autocomplete="name" required>

                    <label for="email" class="sr-only">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>

                    <label for="message" class="sr-only">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Message" required></textarea>

                    <button type="submit">Send message</button>
                </form>
            </section>

        </div>

        <!-- Embedded Google Map of Freetown -->
        <section class="map-container" id="map">
            <iframe
                title="Map of Freetown, Sierra Leone"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126265.1843477123!2d-13.272186950000002!3d8.46567675!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zOMKwMjcnNTYuNCJOIDEzwrAxNicxOS45Ilc!52e0!3m2!1sen!2ssl!4v1710000000000!5m2!1sen!2ssl"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>
    </main>

    <!-- Footer section -->
    <footer class="site-footer">
        <a href="index.html" class="footer-logo">SALONE BITES</a>
        <nav class="footer-links" aria-label="Footer">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="contact.html#map">Location</a>
        </nav>
        <p class="copyright">&copy; 2026 Salone Bites. All rights reserved.</p>
    </footer>

</body>
</html>
